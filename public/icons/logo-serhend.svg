<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Serhend Turizm">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12325f"/>
      <stop offset="55%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#0a2f4a"/>
    </linearGradient>
    <linearGradient id="yol" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5a4"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="parlak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Zemin -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#zemin)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#parlak)"/>

  <!-- Yol: S harfi biçiminde kıvrılan şerit -->
  <path d="M92 30 C92 18, 52 18, 44 34 C34 54, 96 54, 90 78 C84 100, 44 102, 36 94"
        fill="none" stroke="url(#yol)" stroke-width="13" stroke-linecap="round"/>
  <path d="M92 30 C92 18, 52 18, 44 34 C34 54, 96 54, 90 78 C84 100, 44 102, 36 94"
        fill="none" stroke="#0b1f3a" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="7 9" opacity=".55"/>

  <!-- Otobüs: yolun üzerinde ilerleyen sade gövde -->
  <g transform="translate(58 84) rotate(-8)">
    <rect x="-21" y="-13" width="42" height="22" rx="6" fill="#ffffff"/>
    <rect x="-16.5" y="-9" width="14" height="8" rx="2.4" fill="#12325f"/>
    <rect x="0.5" y="-9" width="14" height="8" rx="2.4" fill="#12325f"/>
    <rect x="-19" y="3" width="38" height="2.6" rx="1.3" fill="#cbd5e1"/>
    <circle cx="-12" cy="10" r="4.4" fill="#0b1f3a"/>
    <circle cx="-12" cy="10" r="1.7" fill="#94a3b8"/>
    <circle cx="12" cy="10" r="4.4" fill="#0b1f3a"/>
    <circle cx="12" cy="10" r="1.7" fill="#94a3b8"/>
  </g>
</svg>
