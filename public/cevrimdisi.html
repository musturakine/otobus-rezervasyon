<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bağlantı yok</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
  <div style="max-width:380px">
    <div style="width:74px;height:74px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;
                background:linear-gradient(140deg,#0b1f3a,#1e4b8f);color:#fff">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>
    <h2 style="font-size:20px;margin-bottom:8px">İnternet bağlantısı yok</h2>
    <p style="color:var(--muted);margin:0 0 20px;font-size:14px">
      Bilet satışı ve koltuk bilgisi için bağlantı gerekiyor. Koltukların doğru görünmesi
      ve aynı koltuğun iki kez satılmaması buna bağlı.
    </p>
    <button class="btn btn-primary" onclick="location.reload()">Tekrar dene</button>
    <p style="color:var(--faint);font-size:12.5px;margin-top:22px">
      Bağlantı gelince bu ekran kendiliğinden kapanır.
    </p>
  </div>
</div>
<script>
  window.addEventListener('online', () => location.replace('/app.html'));
  setInterval(() => { if (navigator.onLine) location.replace('/app.html'); }, 4000);
</script>
</body>
</html>
