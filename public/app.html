<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0b1f3a">
<title>Otobüs Rezervasyon Sistemi</title>

<!-- Telefonda uygulama gibi çalışması için -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rezervasyon">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app">
  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand-mark">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17h16M6 17v2M18 17v2M5 6h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>
            <path d="M3 10h18M9 6v4M15 6v4"/>
          </svg>
        </div>
        <span id="sideBrand">REZERVASYON</span>
      </div>
    </div>

    <nav class="side-scroll" id="nav"></nav>

    <div class="side-foot">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div class="who">
          <b id="whoName">—</b>
          <span id="whoRole">—</span>
        </div>
        <button class="x-btn" id="logoutBtn" title="Çıkış yap" style="color:#8ea6cc">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar no-print">
      <button class="hamburger" id="hamburger" aria-label="Menü">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h2 id="pageTitle">Panel</h2>
      <div id="liveDot" class="live-dot" title="Canlı bağlantı"><i></i><span id="liveText">bağlanıyor</span></div>
      <button class="btn btn-ghost btn-icon" id="themeBtn" title="Tema değiştir">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="Yenile">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></svg>
      </button>
    </header>

    <main class="content" id="view">
      <div class="loading-box"><span class="spinner"></span> Yükleniyor…</div>
    </main>

    <!-- Telefonda alt menü -->
    <nav class="bottom-nav no-print" id="bottomNav"></nav>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>
<div id="installBar" class="install-bar" hidden>
  <div style="flex:1">
    <b>Ana ekrana ekleyin</b>
    <div>Uygulama gibi tam ekran açılsın, her seferinde adres yazmayın.</div>
  </div>
  <button class="btn btn-sm btn-ghost" id="installNo">Şimdi değil</button>
  <button class="btn btn-sm btn-primary" id="installYes">Ekle</button>
</div>

<script src="/js/app.js"></script>
</body>
</html>
